[package]
name = "halo2-shape"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Shape benchmark: proof size and proving time of the tightest Halo2-KZG layouts that could host the SH-20 spend relation"

[workspace]

[dependencies]
halo2_proofs = { git = "https://github.com/privacy-scaling-explorations/halo2", tag = "v0.3.0", default-features = false, features = ["batch"] }
ff = "0.13"
rand_core = { version = "0.6", features = ["getrandom"] }
rayon = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
