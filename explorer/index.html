<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-8VQmgO9KEcuvreiVwaLPYuAZNKgLsn/AhxSIps1p96o='; style-src 'unsafe-inline'; connect-src http: https:; img-src data:; base-uri 'none'; form-action 'none'">

<title>SH-20 Explorer</title>
<style>
:root {
  /* A Bitcoin block explorer for a sealed pool: public data in plain text, sealed data as a hatched "Hidden" chip.
     Top bar with search, a strip of recent blocks, then tables. */
  --bg: #121826;
  --panel: #1a2234;
  --panel-2: #222c42;
  --line: #2d3953;
  --text: #e5e9f1;
  --muted: #8d99b0;
  --btc: #f7931a;
  --ok: #46b97f;
  --bad: #f2675c;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/1.5 var(--sans); }
a { color: var(--btc); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--btc); outline-offset: 2px; }
h1, h2 { margin: 0; font-weight: 650; line-height: 1.2; }
h1 { font-size: 22px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
h2 { font-size: 16px; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.mono { font-family: var(--mono); font-size: 13px; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.wrap { width: min(1180px, 100% - 32px); margin-inline: auto; }
.break { overflow-wrap: anywhere; }

/* ---- top bar ---- */
.top { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.top .wrap { display: flex; align-items: center; gap: 18px; min-height: 60px; flex-wrap: wrap; padding-block: 8px; }
.brand { color: var(--text); font-weight: 750; font-size: 18px; display: flex; align-items: center; gap: 8px; }
.brand:hover { text-decoration: none; }
.logo { width: 26px; height: 26px; border-radius: 6px; background: var(--btc); color: #1a1205; display: grid; place-items: center; font-size: 11px; font-weight: 800; letter-spacing: -0.02em; }
.brand span { color: var(--muted); font-weight: 500; }
.brand .logo { color: #1a1205; font-weight: 800; }
.top nav { display: flex; gap: 4px; }
.top nav a { color: var(--muted); padding: 6px 10px; border-radius: 6px; font-weight: 500; }
.top nav a:hover { color: var(--text); background: var(--panel-2); text-decoration: none; }
.top nav a[aria-current="page"] { color: var(--text); background: var(--panel-2); }
.search { flex: 1 1 280px; display: flex; }
.search input { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.search input::placeholder { color: var(--muted); }
.net { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.gear { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; color: var(--muted); }
.gear:hover { color: var(--text); border-color: var(--muted); }

.notice { font-size: 13px; padding: 7px 0; border-bottom: 1px solid var(--line); color: var(--muted); }
.notice.demo b { color: var(--btc); font-weight: 600; }
.notice.error { background: #3a1d22; color: #ffd5d1; }
.notice .linklike { background: none; border: 0; padding: 0; color: var(--btc); }

main { padding-block: 24px 56px; display: grid; gap: 24px; }

/* ---- stats ---- */
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stat { background: var(--panel); padding: 12px 16px; display: grid; gap: 2px; }
.stat small { color: var(--muted); font-size: 12px; }
.stat b { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; }

/* ---- blocks strip ---- */
.blocks { display: grid; grid-auto-flow: column; grid-auto-columns: 128px; gap: 14px; overflow-x: auto; padding: 14px 16px; }
.cube { display: grid; gap: 6px; color: var(--text); }
.cube:hover { text-decoration: none; }
.cube .h { color: var(--btc); font-weight: 650; font-size: 14px; font-variant-numeric: tabular-nums; }
.cube .face { height: 112px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); position: relative; overflow: hidden; display: grid; align-content: start; padding: 9px 10px; gap: 2px; }
.cube .face b { font-size: 15px; position: relative; z-index: 1; }
.cube .face small { color: var(--text); opacity: 0.85; font-size: 12px; position: relative; z-index: 1; }
.cube .fill { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; }
.cube .fill .pub { background: rgba(247, 147, 26, 0.55); }
.cube .fill .priv { background: repeating-linear-gradient(135deg, #46536f 0 5px, #33405a 5px 10px); }
.cube:hover .face { border-color: var(--btc); }

/* ---- panels and tables ---- */
.grid2 { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.panel > header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.panel > header a { font-size: 13px; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 500; color: var(--muted); padding: 9px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 16px; border-bottom: 1px solid var(--line); vertical-align: top; font-variant-numeric: tabular-nums; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: rgba(255, 255, 255, 0.02); }
td.r, th.r { text-align: right; }
.type { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 5px; background: var(--panel-2); border: 1px solid var(--line); white-space: nowrap; }
.type.TRANSFER { border-color: #4b5875; }
.type.REJECTED { color: var(--bad); border-color: rgba(242, 103, 92, 0.5); background: none; }
.sealed { display: inline-block; font-size: 12px; font-weight: 600; color: #c9d1e0; padding: 1px 8px; border-radius: 5px; background: repeating-linear-gradient(135deg, #3d4964 0 5px, #2d3850 5px 10px); white-space: nowrap; }
.ok { color: var(--ok); }
.bad { color: var(--bad); }
.pill { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.bar { height: 5px; border-radius: 3px; background: var(--panel-2); margin-top: 6px; min-width: 80px; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--btc); }
.empty { padding: 18px 16px; color: var(--muted); }

/* ---- detail pages ---- */
.crumbs { font-size: 13px; color: var(--muted); }
.kv { display: grid; grid-template-columns: 220px minmax(0, 1fr); margin: 0; }
.kv > div { display: contents; }
.kv dt, .kv dd { padding: 10px 16px; border-bottom: 1px solid var(--line); margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.kv > div:last-child dt, .kv > div:last-child dd { border-bottom: 0; }
.copy { background: none; border: 1px solid var(--line); border-radius: 5px; padding: 1px 7px; font-size: 12px; color: var(--muted); margin-left: 8px; vertical-align: 1px; }
.copy:hover { color: var(--text); }
.io { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.io ul { list-style: none; margin: 0; padding: 0; }
.io li { padding: 10px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 3px; }
.io li:last-child { border-bottom: 0; }
.io li .mono { overflow-wrap: anywhere; }
.io .lbl { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }

/* ---- settings ---- */
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(560px, 100% - 24px); }
dialog::backdrop { background: rgba(5, 8, 14, 0.7); }
.dlg { padding: 18px; display: grid; gap: 14px; }
.dlg label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
.dlg textarea, .dlg input { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: 13px/1.5 var(--mono); color: var(--text); width: 100%; }
.dlg textarea { min-height: 84px; resize: vertical; }
.dlg .row { display: flex; gap: 10px; justify-content: flex-end; }
.btn { background: var(--btc); color: #1a1205; border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 650; }
.btn.ghost { background: none; color: var(--text); border: 1px solid var(--line); }
.cmp { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
.cmp li { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }

footer { border-top: 1px solid var(--line); padding: 18px 0 28px; color: var(--muted); font-size: 12px; }

@media (max-width: 900px) {
  .grid2, .io { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats .stat:last-child { grid-column: 1 / -1; }
}
@media (max-width: 600px) {
  .top nav { order: 3; width: 100%; overflow-x: auto; }
  .search { order: 4; flex-basis: 100%; }
  .kv { grid-template-columns: minmax(0, 1fr); }
  .kv dt { border-bottom: 0; padding-bottom: 0; font-size: 12px; }
  .kv dd { padding-top: 2px; }
  th, td { padding-inline: 12px; }
  .hide-sm { display: none; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#"><span class="logo" aria-hidden="true">SH</span>SH-20 <span>Explorer</span></a>
    <nav aria-label="Main">
      <a href="#" data-nav="dashboard">Dashboard</a>
      <a href="#blocks" data-nav="blocks">Blocks</a>
      <a href="#txs" data-nav="txs">Transactions</a>
      <a href="#tokens" data-nav="tokens">Tokens</a>

    <form class="search" id="search" role="search">
      <input id="q" type="search" spellcheck="false" autocomplete="off" aria-label="Search" placeholder="Search txid, block, ticker or nullifier">
    </form>
    <span class="net" id="net"></span>
    <button class="gear" id="gear" type="button">Indexers</button>
  </div>
</header>
<div id="notices"></div>
<main class="wrap" id="view"></main>
<footer><div class="wrap">SH-20 Explorer. Open source, MIT license. Reads any SH-20 indexer; settings stay in this browser.</div></footer>
<dialog id="settings" aria-labelledby="setTitle">
  <form class="dlg" id="setForm">
    <h2 id="setTitle">Indexers</h2>
    <label for="ixList">Indexer URLs, one per line (the first one is read)<textarea id="ixList" spellcheck="false" autocomplete="off" placeholder="https://indexer.example"></textarea></label>
    <label for="ixExplorer">Bitcoin explorer for raw transactions<input id="ixExplorer" type="url" spellcheck="false" autocomplete="off" placeholder="https://mempool.space/signet"></label>
    <ul class="cmp" id="cmp"></ul>
    <div class="row"><button class="btn ghost" type="button" id="setCancel">Cancel</button><button class="btn" type="submit" id="setSave">Save</button></div>
  </form>
</dialog>

  const tokenLink = (t) => html`<a href="#token-${t}">${t}</a>`;
  const blockLink = (h) => html`<a class="num" href="#block-${h}">${n(h)}</a>`;
  const copyBtn = (text) => html`<button class="copy" type="button" data-copy="${text}">Copy</button>`;

  // ---- data source ----
  const DEMO = (() => { try { return JSON.parse($('#demo-data').textContent || '{}'); } catch { return {}; } })();
  const validUrl = (u) => { try { const x = new URL(u); return x.protocol === 'https:' || x.protocol === 'http:'; } catch { return false; } };
  class NotFound extends Error {}
  function client(base) {
    if (!base) {
      return { name: 'demo sample', get: async (p) => { const v = DEMO.routes && DEMO.routes[p]; if (v === undefined) throw new NotFound('not found'); return JSON.parse(JSON.stringify(v)); } };
    }
    const root = base.replace(/\/+$/, '');
    return {
      name: root,
      get: async (p) => {
        const ctl = new AbortController();
        const timer = setTimeout(() => ctl.abort(), 8000);
        try {
          const r = await fetch(root + p, { signal: ctl.signal, headers: { accept: 'application/json' }, credentials: 'omit', referrerPolicy: 'no-referrer' });
          if (r.status === 404) throw new NotFound('not found');
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return await r.json();
        } catch (e) {
          if (e instanceof NotFound) throw e;
          throw new Error(e.name === 'AbortError' ? 'timeout' : e.message);
        } finally { clearTimeout(timer); }
      },
    };
  }

  const S = { demo: true, fromLink: false, indexers: [], explorer: '', status: null, tokens: [], listings: [], blocks: [], rows: [], compare: null, error: null };
  const tokenOf = (t) => S.tokens.find((x) => x.ticker === t);
  const listingOf = (id) => S.listings.find((x) => x.listTxid === id);

  // One row per SH-20 transaction (or block event), newest first.
  function buildRows() {
    const rows = [];
    for (const b of S.blocks) {
      const seen = new Set();
      for (const e of b.events) {
        if (e.txid && seen.has(e.txid)) continue;
        if (e.txid) seen.add(e.txid);
        rows.push({ txid: e.txid || null, height: b.height, type: e.type, ev: e });
      }
      for (const r of b.rejected) rows.push({ txid: r.txid, height: b.height, type: 'REJECTED', reason: r.reason });
    }
    S.rows = rows;
  }
  const blockTxCount = (b) => new Set([...b.events.filter((e) => e.txid).map((e) => e.txid), ...b.rejected.map((r) => r.txid)]).size;
  const blockPrivate = (b) => new Set(b.events.filter((e) => e.type === 'TRANSFER').map((e) => e.txid)).size;
  function tickerOfRow(row) {
    const e = row.ev;
    if (!e) return null;
    if (e.ticker) return e.ticker;
    const l = e.listTxid ? listingOf(e.listTxid) : null;
    return l ? l.ticker : null;
  }
  function tokenAndAmount(row) {
    const e = row.ev;
    if (!e) return { token: '', amount: '' };
    const l = e.listTxid ? listingOf(e.listTxid) : null;
    switch (e.type) {
      case 'TRANSFER': return { token: HIDDEN, amount: HIDDEN };
      case 'DEPLOY': { const t = tokenOf(e.ticker); return { token: tokenLink(e.ticker), amount: t ? html`<span class="muted">max ${n(t.max)}</span>` : '' }; }
      case 'MINT': case 'BURN': case 'TEAM_UNLOCK': return { token: tokenLink(e.ticker), amount: n(e.v) };
      case 'LIST': return { token: tokenLink(e.ticker), amount: n(e.amount) };
      case 'TAKE': case 'CLAIM': case 'CLOSED': return l ? { token: tokenLink(l.ticker), amount: n(l.amount) } : { token: '', amount: '' };
      default: return { token: '', amount: '' };
    }
  }

  async function load() {
    const fromLink = new URLSearchParams(location.search).getAll('indexer').filter(validUrl);
    S.fromLink = fromLink.length > 0;
    S.indexers = S.fromLink ? fromLink : (store.get('indexers') || []).filter(validUrl);
    const ex = store.get('explorer');
    S.explorer = validUrl(ex || '') ? ex : '';
    S.demo = S.indexers.length === 0;
    S.client = client(S.demo ? null : S.indexers[0]);
    S.error = null;
    try {
      const [status, tokens, listings, blocks] = await Promise.all(['/status', '/tokens', '/listings', '/blocks?limit=200'].map((p) => S.client.get(p)));
      Object.assign(S, { status, tokens, listings, blocks });
    } catch (e) {
      S.error = e.message;
      Object.assign(S, { status: null, tokens: [], listings: [], blocks: [] });
    }
    buildRows();
    renderChrome();
    await route();
    compare();
  }

  async function compare() {
    if (S.demo || S.error || S.indexers.length < 2) { S.compare = null; renderCompare(); return; }
    S.compare = { pending: true };
    renderCompare();
    const clients = S.indexers.map(client);
    const st = await Promise.all(clients.map((c) => c.get('/status').then((s) => s, () => null)));
    const hs = st.filter((s) => s && Number.isInteger(s.height)).map((s) => s.height);
    const h = hs.length ? Math.min(...hs) : null;
    const ds = await Promise.all(clients.map((c, i) => (st[i] && h !== null ? c.get('/digest/' + h).then((d) => d.digest, () => null) : Promise.resolve(null))));
    S.compare = { height: h, rows: clients.map((c, i) => ({ url: c.name, digest: ds[i], same: ds[i] !== null && ds[i] === ds[0] })) };
    renderCompare();
    if (route.current === 'dashboard') route();
  }
  function compareSummary() {
    if (S.demo) return html`<span class="muted">Demo sample</span>`;
    if (S.error) return html`<span class="bad">Unreachable</span>`;
    if (S.indexers.length < 2) return html`<span class="muted">1 connected</span>`;
    const c = S.compare;
    if (!c || c.pending) return html`<span class="muted">Comparing…</span>`;
    const agree = c.rows.filter((r) => r.same).length;
    return html`<span class="${agree === c.rows.length ? 'ok' : 'bad'}">${agree} of ${c.rows.length} agree</span>`;
  }

  // ---- chrome ----
  function renderChrome() {
    $('#net').textContent = S.status ? S.status.network : S.demo ? 'demo' : 'offline';
    const notes = [];
    if (S.error) notes.push(html`<div class="notice error"><div class="wrap">Cannot read ${S.client.name} (${S.error}). Check the URL in <button class="linklike" type="button" data-open-settings>Indexers</button>.</div></div>`);
    else if (S.demo) notes.push(html`<div class="notice demo"><div class="wrap"><b>Demo data.</b> A test chain replayed by the reference indexer; no SH-20 network is live yet. <button class="linklike" type="button" data-open-settings>Connect an indexer</button></div></div>`);
    if (S.fromLink) notes.push(html`<div class="notice"><div class="wrap">Reading ${S.indexers.join(', ')} from the link (not saved).</div></div>`);
    put($('#notices'), html`${notes}`);
  }

  // ---- views ----
  function txTable(rows, { withBlock = true, limit = Infinity } = {}) {
    const list = rows.slice(0, limit);
    if (!list.length) return html`<div class="empty">No transactions.</div>`;
    return html`<div class="scroll"><table>
      <thead><tr><th>Transaction</th><th>Type</th><th>Token</th><th class="r">Amount</th>${withBlock ? html`<th class="r hide-sm">Block</th>` : ''}</tr></thead>
      <tbody>${list.map((r) => {
        const ta = tokenAndAmount(r);
        return html`<tr><td>${r.txid ? txLink(r.txid) : html`<span class="muted">Block event</span>`}</td><td>${typeChip(r.type)}</td>
          <td>${r.type === 'REJECTED' ? html`<span class="muted">${r.reason}</span>` : ta.token}</td><td class="r">${ta.amount}</td>${withBlock ? html`<td class="r hide-sm">${blockLink(r.height)}</td>` : ''}</tr>`;
      })}</tbody></table></div>`;
  }

  function mintInfo(t) {
    const max = BigInt(t.max), pre = BigInt(t.pre), lim = BigInt(t.lim), mints = BigInt(t.mints);
    const cap = (max - pre) / lim;
    return { cap, mints, minted: mints * lim, share: cap > 0n ? Number((mints * 10000n) / cap) / 100 : 0 };
  }
  const priceText = (t) => (t.payMode === 0 || BigInt(t.price) === 0n ? 'Free' : `${n(t.price)} sats`);
  // The one supply check a sealed pool allows: units leaving it in public never exceed units issued.
  function supplyCheck(t) {
    const h = S.status ? S.status.height : 0;
    const pre = BigInt(t.pre);
    const issued = mintInfo(t).minted + (pre > 0n && h >= t.unlock ? pre : 0n);
    const offers = S.listings.filter((l) => l.ticker === t.ticker && (l.state === 'ACTIVE' || l.state === 'CLOSED')).reduce((a, l) => a + BigInt(l.amount), 0n);
    const out = BigInt(t.burned) + offers;
    return { ok: out <= issued, issued, offers, out };
  }

  function tokenTable(tokens) {
    if (!tokens.length) return html`<div class="empty">No tokens deployed yet.</div>`;
    return html`<div class="scroll"><table>
      <thead><tr><th>Ticker</th><th>Minted</th><th class="r">Price</th><th class="r hide-sm">Holders</th></tr></thead>
      <tbody>${tokens.map((t) => {
        const m = mintInfo(t);
        return html`<tr><td>${tokenLink(t.ticker)}</td><td><span class="num">${pct(m.share)}</span><div class="bar"><i style="width:${Math.min(100, m.share)}%"></i></div></td>
          <td class="r">${priceText(t)}</td><td class="r hide-sm">${HIDDEN}</td></tr>`;
      })}</tbody></table></div>`;
  }

  function viewDashboard() {
    const s = S.status;
    const stats = html`<div class="stats">
      <div class="stat"><small>Block height</small><b>${s ? n(s.height) : '–'}</b></div>
      <div class="stat"><small>Notes in the pool</small><b>${s ? n(s.leaves) : '–'}</b></div>
      <div class="stat"><small>Spent notes</small><b>${s ? n(s.nullifiers) : '–'}</b></div>
      <div class="stat"><small>Tokens</small><b>${s ? n(s.tokens) : '–'}</b></div>
      <div class="stat"><small>Indexers</small><b>${compareSummary()}</b></div>
    </div>`;
    const cubes = S.blocks.slice(0, 12).map((b) => {
      const txs = blockTxCount(b);
      const priv = blockPrivate(b);
      const pub = Math.max(0, txs - priv);
      return html`<a class="cube" href="#block-${b.height}"><span class="h">${n(b.height)}</span>
        <span class="face"><b>${txs} tx</b><small>${priv} private</small><small>${pub} public</small>
          <span class="fill" style="height:${Math.round(18 + 70 * Math.min(1, txs / 10))}%"><span class="priv" style="flex:${priv}"></span><span class="pub" style="flex:${pub}"></span></span></span></a>`;
    });
    return html`${stats}
      <section class="panel"><header><h2>Latest blocks with SH-20 activity</h2><a href="#blocks">View all</a></header>
        ${cubes.length ? html`<div class="blocks">${cubes}</div>` : html`<div class="empty">No SH-20 activity yet.</div>`}</section>
      <div class="grid2">
        <section class="panel"><header><h2>Latest transactions</h2><a href="#txs">View all</a></header>${txTable(S.rows, { limit: 12 })}</section>
        <section class="panel"><header><h2>Tokens</h2><a href="#tokens">View all</a></header>${tokenTable(S.tokens.slice(0, 10))}</section>
      </div>`;
  }

  function viewBlocks() {
    if (!S.blocks.length) return html`<h1>Blocks</h1><section class="panel"><div class="empty">No SH-20 activity yet.</div></section>`;
    return html`<h1>Blocks</h1><section class="panel"><div class="scroll"><table>
      <thead><tr><th>Height</th><th class="r">SH-20 txs</th><th class="r">Private</th><th class="r hide-sm">Notes after</th><th class="hide-sm">State digest</th></tr></thead>
      <tbody>${S.blocks.map((b) => html`<tr><td>${blockLink(b.height)}</td><td class="r">${blockTxCount(b)}</td><td class="r">${blockPrivate(b)}</td>
        <td class="r hide-sm">${n(b.leaves)}</td><td class="mono muted hide-sm">${short(b.digest, 12, 12)}</td></tr>`)}</tbody></table></div></section>`;
  }

  const viewTxs = () => html`<h1>Transactions</h1><section class="panel">${txTable(S.rows)}</section>`;

  function viewTokens() {
    if (!S.tokens.length) return html`<h1>Tokens</h1><section class="panel"><div class="empty">No tokens deployed yet.</div></section>`;
    return html`<h1>Tokens</h1><section class="panel"><div class="scroll"><table>
      <thead><tr><th>Ticker</th><th class="r">Max supply</th><th>Minted</th><th class="r">Per mint</th><th class="r">Price</th><th class="r hide-sm">Team</th><th class="r hide-sm">Burned</th><th class="hide-sm">Supply check</th></tr></thead>
      <tbody>${S.tokens.map((t) => {
        const m = mintInfo(t); const sc = supplyCheck(t);
        return html`<tr><td>${tokenLink(t.ticker)}</td><td class="r">${n(t.max)}</td>
          <td>${n(m.minted)} <span class="muted">(${pct(m.share)})</span><div class="bar"><i style="width:${Math.min(100, m.share)}%"></i></div></td>
          <td class="r">${n(t.lim)}</td><td class="r">${priceText(t)}</td><td class="r hide-sm">${BigInt(t.pre) > 0n ? n(t.pre) : html`<span class="muted">None</span>`}</td>
          <td class="r hide-sm">${n(t.burned)}</td><td class="hide-sm"><span class="pill ${sc.ok ? 'ok' : 'bad'}">${sc.ok ? 'OK' : 'Exceeded'}</span></td></tr>`;
      })}</tbody></table></div></section>`;
  }

  const kv = (rows) => html`<dl class="kv">${rows.filter(Boolean).map(([k, v]) => html`<div><dt>${k}</dt><dd>${v}</dd></div>`)}</dl>`;

  function viewBlock(h) {
    const b = S.blocks.find((x) => x.height === h);
    if (!b) {
      return html`<div class="crumbs"><a href="#blocks">Blocks</a></div><h1>Block ${n(h)}</h1>
        <section class="panel"><div class="empty">No SH-20 transaction in this block${S.status && h > S.status.height ? ' (not indexed yet)' : ''}.</div></section>`;
    }
    const rows = S.rows.filter((r) => r.height === h);
    return html`<div class="crumbs"><a href="#blocks">Blocks</a></div><h1>Block ${n(h)}</h1>
      <section class="panel">${kv([
        ['Block hash', b.hash ? html`<span class="mono">${b.hash}</span>` : html`<span class="muted">Unknown</span>`],
        ['SH-20 transactions', String(blockTxCount(b))],
        ['Private transactions', String(blockPrivate(b))],
        ['Notes in the pool after this block', n(b.leaves)],
        ['Note tree root', html`<span class="mono">${b.root}</span>`],
        ['State digest', html`<span class="mono">${b.digest}</span>${copyBtn(b.digest)}`],
      ])}</section>
      <section class="panel"><header><h2>Transactions</h2></header>${txTable(rows, { withBlock: false })}</section>`;
  }

  async function viewTx(id) {
    let tx;
    try { tx = await S.client.get('/tx/' + id); } catch (e) {
      if (e instanceof NotFound) return viewNullifier(id);
      return html`<h1>Transaction</h1><section class="panel"><div class="empty">Cannot load this transaction (${e.message}).</div></section>`;
    }
    const e = tx.event;
    const type = e ? e.type : 'REJECTED';
    const l = e && e.listTxid ? listingOf(e.listTxid) : null;
    const tk = e && e.ticker ? tokenOf(e.ticker) : null;
    const nfs = e ? (e.nullifiers || (e.burn && e.burn.nullifiers) || []) : [];
    const rows = [
      ['Transaction ID', html`<span class="mono">${tx.txid}</span>${copyBtn(tx.txid)}`],
      ['Status', tx.rejected ? html`<span class="bad">Rejected: ${tx.rejected}</span>` : html`<span class="ok">Accepted</span>`],
      ['Block', blockLink(tx.height)],
      ['Type', typeChip(type)],
    ];
    if (e) {
      switch (e.type) {
        case 'TRANSFER':
          rows.push(['Token', HIDDEN], ['Amount', HIDDEN], ['Sender', HIDDEN], ['Recipient', HIDDEN], ['Proof', VERIFIED]);
          break;
        case 'DEPLOY':
          if (tk) {
            rows.push(['Token', tokenLink(e.ticker)], ['Max supply', n(tk.max)], ['Per mint', n(tk.lim)], ['Price', priceText(tk)],
              ['Team allocation', BigInt(tk.pre) > 0n ? html`${n(tk.pre)}, unlocks at block ${blockLink(tk.unlock)}` : 'None']);
          }
          if (e.burn && S.status) rows.push(['Deploy fee', html`${n(S.status.deployBurn)} ${tokenLink(S.status.genesis)} burned`], ['Paid by', HIDDEN], ['Proof', VERIFIED]);
          break;
        case 'MINT':
          rows.push(['Token', tokenLink(e.ticker)], ['Amount', n(e.v)], ['Price paid', tk ? (tk.payMode === 0 ? 'Free' : `${n(tk.price)} sats ${tk.payMode === 1 ? '(burned)' : '(to the deployer)'}`) : '']);
          break;
        case 'BURN':
          rows.push(['Token', tokenLink(e.ticker)], ['Amount burned', n(e.v)], ['Sender', HIDDEN], ['Proof', VERIFIED]);
          break;
        case 'LIST':
          rows.push(['Token', tokenLink(e.ticker)], ['Amount', n(e.amount)], ['Price', `${n(e.price)} sats`], ['Seller', HIDDEN],
            ['Listing status', l ? l.state : ''], ['Lock output', l ? html`<span class="mono">${l.lock}</span>` : ''], ['Proof', VERIFIED]);
          break;
        case 'TAKE':
          if (l) rows.push(['Token', tokenLink(l.ticker)], ['Amount', n(l.amount)], ['Price', `${n(l.price)} sats`]);
          rows.push(['Outcome', e.outcome === 'SOLD' ? 'Sold' : 'Cancelled by the seller'], ['Listing', txLink(e.listTxid, 12, 12)]);
          break;
        case 'CLAIM': case 'CLOSED':
          if (l) rows.push(['Token', tokenLink(l.ticker)], [e.type === 'CLAIM' ? 'Amount returned' : 'Amount', n(l.amount)]);
          rows.push(['Listing', txLink(e.listTxid, 12, 12)]);
          break;
        default: break;
      }
    }
    const raw = !S.demo && S.explorer ? S.explorer.replace(/\/+$/, '') + '/tx/' + tx.txid : null;
    rows.push(['Raw transaction', raw ? html`<a href="${raw}" rel="noopener noreferrer">View on Bitcoin explorer</a>` : html`<span class="muted">${S.demo ? 'Demo transaction, not on any network' : 'Set a Bitcoin explorer under Indexers'}</span>`]);
    const notes = tx.notes || [];
    const kind = { MINT: 'Minted note', TEAM: 'Team note', TAKE: "Buyer's note", CLAIM: "Seller's note", OUT: 'Sealed note' };
    const io = nfs.length || notes.length ? html`<div class="io">
      <section class="panel"><header><h2>Inputs</h2><span class="muted">${nfs.length} spent</span></header>
        ${nfs.length ? html`<ul>${nfs.map((x) => html`<li><span class="lbl"><span>Nullifier</span><span class="muted">Spent note ${HIDDEN}</span></span><span class="mono">${x}</span></li>`)}</ul>` : html`<div class="empty">No notes spent.</div>`}</section>
      <section class="panel"><header><h2>Outputs</h2><span class="muted">${notes.length} new</span></header>
        ${notes.length ? html`<ul>${notes.map((x) => html`<li><span class="lbl"><span>${kind[x.kind] || x.kind}</span><span class="muted num">#${n(x.pos)}</span></span>
          <span class="mono">${x.leaf}</span>${x.kind === 'OUT' ? html`<span class="muted">Token ${HIDDEN} Amount ${HIDDEN} Owner ${HIDDEN}</span>` : html`<span class="muted">${x.ticker ? html`${n(x.v)} ${tokenLink(x.ticker)}` : ''}</span>`}</li>`)}</ul>` : html`<div class="empty">No notes created.</div>`}</section>
    </div>` : '';
    return html`<div class="crumbs"><a href="#txs">Transactions</a></div><h1>Transaction ${typeChip(type)}</h1>
      <section class="panel">${kv(rows)}</section>${io}`;
  }

  async function viewNullifier(hex) {
    let spent = false;
    try { spent = (await S.client.get('/nullifier/' + hex)).spent === true; } catch { spent = false; }
    const where = S.rows.find((r) => r.ev && ((r.ev.nullifiers || []).includes(hex) || (r.ev.burn && r.ev.burn.nullifiers.includes(hex))));
    if (!spent && !where) return notFound(hex);
    return html`<div class="crumbs">Nullifier</div><h1>Nullifier</h1><section class="panel">${kv([
      ['Nullifier', html`<span class="mono">${hex}</span>`],
      ['Status', html`<span class="bad">Spent</span>`],
      ['Spent in', where ? txLink(where.txid, 12, 12) : html`<span class="muted">An older block</span>`],
      ['Block', where ? blockLink(where.height) : ''],
      ['Spent note', HIDDEN],
    ])}</section>`;
  }

  function viewToken(tk) {
    const t = tokenOf(tk);
    if (!t) return notFound(tk);
    const m = mintInfo(t); const sc = supplyCheck(t);
    const h = S.status ? S.status.height : 0;
    const pre = BigInt(t.pre);
    const team = pre === 0n ? 'None' : html`${n(pre)} (${pct(Number((pre * 10000n) / BigInt(t.max)) / 100)}), ${h >= t.unlock ? html`<span class="ok">unlocked</span>` : 'locked until'} block ${blockLink(t.unlock)}`;
    const rows = S.rows.filter((r) => tickerOfRow(r) === t.ticker);
    return html`<div class="crumbs"><a href="#tokens">Tokens</a></div><h1>${t.ticker}${S.status && S.status.genesis === t.ticker ? html` <span class="type">Genesis</span>` : ''}</h1>
      <section class="panel">${kv([
        ['Max supply', n(t.max)],
        ['Minted', html`${n(m.minted)} (${n(m.mints)} of ${n(m.cap)} mints)<div class="bar" style="max-width:260px"><i style="width:${Math.min(100, m.share)}%"></i></div>`],
        ['Per mint', n(t.lim)],
        ['Price', t.payMode === 0 ? 'Free' : html`${n(t.price)} sats ${t.payMode === 1 ? '(burned)' : html`to <span class="mono">${t.payScript}</span>`}`],
        ['Mint window', html`From block ${blockLink(t.start)}${t.end ? html` to ${blockLink(t.end)}` : ', no end'}`],
        ['Team allocation', team],
        ['Burned', n(t.burned)],
        ['In open listings', n(sc.offers)],
        ['Supply check', html`<span class="pill ${sc.ok ? 'ok' : 'bad'}">${sc.ok ? 'OK' : 'Exceeded'}</span> <span class="muted">${n(sc.out)} out in public of ${n(sc.issued)} issued</span>`],
        ['Holders and balances', HIDDEN],
        ['Asset id', html`<span class="mono">${t.t}</span>`],
        ['Deployed in', html`${txLink(t.deployTxid, 12, 12)} at block ${blockLink(t.deployHeight)}`],
      ])}</section>
      <section class="panel"><header><h2>Public transactions</h2><span class="muted">Transfers are not linked to any token</span></header>${txTable(rows)}</section>`;
  }

  const notFound = (q) => html`<h1>Not found</h1><section class="panel"><div class="empty">Nothing matches <span class="mono break">${q}</span> on this indexer.</div></section>`;

  // ---- router ----
  async function route() {
    const hash = location.hash.slice(1);
    let m;
    let view;
    let current = 'dashboard';
    if (hash === 'blocks') { current = 'blocks'; view = viewBlocks(); }
    else if (hash === 'txs') { current = 'txs'; view = viewTxs(); }
    else if (hash === 'tokens') { current = 'tokens'; view = viewTokens(); }
    else if ((m = hash.match(/^block-(\d+)$/))) { current = 'blocks'; view = viewBlock(Number(m[1])); }
    else if ((m = hash.match(/^tx-([0-9a-f]{64})$/))) { current = 'txs'; put($('#view'), html`<div class="empty">Loading…</div>`); view = await viewTx(m[1]); }
    else if ((m = hash.match(/^token-([A-Z0-9]{4})$/))) { current = 'tokens'; view = viewToken(m[1]); }
    else view = viewDashboard();
    route.current = current;
    for (const a of document.querySelectorAll('[data-nav]')) {
      if (a.dataset.nav === current) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    }
    put($('#view'), view);
  }
  window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });

  $('#search').addEventListener('submit', (ev) => {
    ev.preventDefault();
    const q = $('#q').value.trim();
    const digits = q.replace(/,/g, '');
    if (!q) return;
    if (/^\d{1,9}$/.test(digits)) location.hash = 'block-' + Number(digits);
    else if (/^[A-Za-z0-9]{4}$/.test(q)) location.hash = 'token-' + q.toUpperCase();
    else if (/^[0-9a-fA-F]{64}$/.test(q)) location.hash = 'tx-' + q.toLowerCase();
    else put($('#view'), notFound(q));
  });

  // ---- settings ----
  const dlg = $('#settings');
  function renderCompare() {
    const c = S.compare;
    if (!c) { put($('#cmp'), html``); return; }
    if (c.pending) { put($('#cmp'), html`<li class="muted">Comparing…</li>`); return; }
    put($('#cmp'), html`${c.rows.map((r) => html`<li><span class="pill ${r.same ? 'ok' : 'bad'}">${r.digest === null ? 'Unreachable' : r.same ? `Same state at ${n(c.height)}` : `Different state at ${n(c.height)}`}</span><span class="mono break">${r.url}</span></li>`)}`);
  }
  function openSettings() {
    $('#ixList').value = S.indexers.join('\n');
    $('#ixExplorer').value = S.explorer;
    renderCompare();
    if (!dlg.open) dlg.showModal();
  }
  $('#gear').addEventListener('click', openSettings);
  $('#setCancel').addEventListener('click', () => dlg.close());
  $('#setForm').addEventListener('submit', (ev) => {
    ev.preventDefault();
    store.set('indexers', $('#ixList').value.split(/\s+/).map((x) => x.trim()).filter(validUrl));
    const ex = $('#ixExplorer').value.trim();
    store.set('explorer', validUrl(ex) ? ex : '');
    dlg.close();
    if (S.fromLink) { location.search = ''; return; }
    load();
  });

  document.addEventListener('click', async (ev) => {
    if (ev.target.closest('[data-open-settings]')) { openSettings(); return; }
    const c = ev.target.closest('[data-copy]');
    if (c) { try { await navigator.clipboard.writeText(c.dataset.copy); c.textContent = 'Copied'; } catch { /* copy refused */ } }
  });

  load();
})();
</script>
</body>
</html>
