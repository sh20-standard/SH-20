<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-/t26ePIFV+5fU2BH7NMalHe1ROWV3YzZDNf6VmsDBrc='; style-src 'unsafe-inline'; connect-src http: https:; img-src data:; base-uri 'none'; form-action 'none'">

<title>SH-20 Explorer</title>
<style>
:root {
  /* A case file on a desk: public facts are marked with a highlighter, private ones are redacted.
     One left-aligned column of evidence; the hero lays three documents side by side. */
  --paper: #e5e8ec;
  --sheet: #fbfbf9;
  --ink: #1a1d22;
  --muted: #59606b;
  --mark: #ffc84f;
  --redact: #000000;
  --rule: #c6ccd4;
  --ok: #24704f;
  --bad: #b42318;
  --serif: "Iowan Old Style", "Charter", "Sitka Text", Cambria, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --s1: 0.8125rem; --s2: 0.9375rem; --s3: 1.0625rem; --s4: 1.375rem; --s5: 1.875rem; --s6: 2.75rem;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 4.5rem; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 var(--s3)/1.55 var(--serif); }
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 0.18em; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--serif); font-weight: 700; line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: var(--s6); letter-spacing: -0.015em; max-width: 18ch; }
h2 { font-size: var(--s5); letter-spacing: -0.01em; }
h3 { font-size: var(--s3); }
p { margin: 0; max-width: 65ch; }
.wrap { width: min(1040px, 100% - 2.5rem); margin-inline: auto; }
.sans { font-family: var(--sans); }
.mono, code { font-family: var(--mono); font-size: var(--s1); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

/* ---- top bar ---- */
.top { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); }
.top .wrap { display: flex; align-items: center; gap: 1.25rem; min-height: 3.5rem; flex-wrap: wrap; padding-block: 0.4rem; }
.brand { font-weight: 700; font-size: var(--s4); text-decoration: none; letter-spacing: -0.01em; }
.brand small { font: 400 var(--s2) var(--sans); color: var(--muted); margin-left: 0.4rem; }
.top nav { display: flex; gap: 1rem; flex-wrap: wrap; font: 500 var(--s2) var(--sans); margin-right: auto; }
.top nav a { text-decoration: none; color: var(--muted); }
.top nav a:hover { color: var(--ink); text-decoration: underline; }
.lang { font: 600 var(--s1) var(--sans); background: none; border: 1px solid var(--rule); border-radius: 999px; padding: 0.25rem 0.7rem; }
.lang:hover { border-color: var(--ink); }

.banner { font: 400 var(--s2)/1.45 var(--sans); padding: 0.7rem 0; }
.banner.demo { background: var(--ink); color: var(--sheet); }
.banner.link { background: var(--mark); color: var(--ink); }
.banner.error { background: var(--bad); color: #fff; }
.banner p { max-width: none; }

main { display: grid; gap: 4.5rem; padding-block: 3rem 5rem; }
section > .wrap { display: grid; gap: 1.25rem; }

/* ---- hero: three documents ---- */
.hero .wrap { gap: 1.5rem; }
.lede { font-size: var(--s4); line-height: 1.45; max-width: 52ch; }
.sheets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.25rem; align-items: start; margin-top: 1rem; }
.sheet { background: var(--sheet); border: 1px solid var(--rule); padding: 1.25rem 1.25rem 1.1rem;
  box-shadow: 0 1px 0 var(--rule), 0 18px 30px -24px rgba(26, 29, 34, 0.45); display: grid; gap: 0.9rem; }
.sheet.sh20 { border: 2px solid var(--ink); }
.sheet header { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
.sheet h3 { font-size: var(--s4); }
.tag { font: 500 var(--s1) var(--sans); color: var(--muted); }
.sheet dl { margin: 0; display: grid; gap: 0.55rem; }
.sheet dl div { display: grid; gap: 0.1rem; }
.sheet dt { font: 400 var(--s1) var(--sans); color: var(--muted); }
.sheet dd { margin: 0; font-size: var(--s3); min-height: 1.6em; }
.sheet .foot { font: 400 var(--s1)/1.45 var(--sans); color: var(--muted); border-top: 1px solid var(--rule); padding-top: 0.7rem; }
.mark { background: linear-gradient(transparent 14%, var(--mark) 14%, var(--mark) 90%, transparent 90%); padding: 0 0.2em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.bar { display: inline-block; vertical-align: -0.2em; height: 1.15em; width: var(--w, 6em); max-width: 100%; background: var(--redact); }
.sheet .bar { transform-origin: left center; animation: redact 520ms cubic-bezier(0.2, 0.7, 0.2, 1) backwards; animation-delay: calc(var(--i, 0) * 120ms + 350ms); }
@keyframes redact { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@media (prefers-reduced-motion: reduce) { .sheet .bar { animation: none; } }

.onchain { background: var(--sheet); border: 1px solid var(--rule); padding: 1.25rem; display: grid; gap: 0.9rem; }
.onchain ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.8rem; }
.onchain li { display: grid; gap: 0.25rem; }
.onchain .hexes { display: grid; gap: 0.15rem; overflow-wrap: anywhere; color: var(--muted); }
.btn { font: 600 var(--s2) var(--sans); background: var(--ink); color: var(--sheet); border: 0; border-radius: 6px; padding: 0.55rem 0.95rem; justify-self: start; }
.btn:hover { background: #000; }
.btn.quiet { background: none; color: var(--ink); border: 1px solid var(--rule); }
.btn.quiet:hover { border-color: var(--ink); }

/* ---- status line ---- */
.status .wrap { display: flex; flex-wrap: wrap; gap: 0.6rem 1.75rem; align-items: center; font: 400 var(--s2) var(--sans); border-block: 1px solid var(--rule); padding-block: 0.9rem; }
.status b { font-weight: 650; font-variant-numeric: tabular-nums; }
.pill { font: 600 var(--s1) var(--sans); border-radius: 999px; padding: 0.2rem 0.65rem; border: 1px solid currentColor; white-space: nowrap; }
.pill.ok { color: var(--ok); }
.pill.bad { color: var(--bad); }
.pill.na { color: var(--muted); }

/* ---- activity ---- */
.feed { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); font-family: var(--sans); }
.feed > li { display: grid; grid-template-columns: 6.5rem 7.5rem minmax(0, 1fr) auto; gap: 0.4rem 1rem; align-items: center; padding: 0.75rem 0; border-bottom: 1px solid var(--rule); }
.feed .blk { font-size: var(--s1); color: var(--muted); font-variant-numeric: tabular-nums; }
.type { font: 600 var(--s1) var(--sans); justify-self: start; padding: 0.15rem 0.55rem; border-radius: 4px; border: 1px solid var(--rule); background: var(--sheet); }
.type.private { background: var(--redact); color: var(--sheet); border-color: var(--redact); }
.type.rejected { color: var(--bad); border-color: currentColor; background: none; }
.feed .what { font-size: var(--s2); }
.feed .what .bar { height: 0.95em; vertical-align: -0.12em; margin: 0 0.35em 0 0.2em; }
.feed > li.rejected .what { color: var(--muted); }
.open { font: 500 var(--s1) var(--sans); background: none; border: 1px solid var(--rule); border-radius: 6px; padding: 0.3rem 0.6rem; }
.open:hover { border-color: var(--ink); }
.feed details summary { cursor: pointer; }
.feed details ul { list-style: none; margin: 0.5rem 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0.4rem; }
.feed details .open { font-family: var(--mono); }

/* ---- supply ---- */
.table { overflow-x: auto; border-top: 1px solid var(--rule); }
table { border-collapse: collapse; width: 100%; font: 400 var(--s2) var(--sans); min-width: 760px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: var(--s1); padding: 0.6rem 0.75rem 0.6rem 0; border-bottom: 1px solid var(--rule); vertical-align: bottom; }
td { padding: 0.8rem 0.75rem 0.8rem 0; border-bottom: 1px solid var(--rule); vertical-align: top; font-variant-numeric: tabular-nums; }
td.ticker { font: 700 var(--s3) var(--serif); }
td small { display: block; color: var(--muted); font-size: var(--s1); margin-top: 0.15rem; }
.meter { height: 4px; background: var(--rule); margin-top: 0.4rem; max-width: 9rem; }
.meter i { display: block; height: 100%; background: var(--ink); }

/* ---- indexers ---- */
.form { display: grid; gap: 0.9rem; max-width: 40rem; font-family: var(--sans); }
.form label { font-size: var(--s2); font-weight: 500; display: grid; gap: 0.35rem; }
.form textarea, .form input { font: 400 var(--s1)/1.5 var(--mono); background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 0.6rem 0.7rem; width: 100%; }
.form textarea { min-height: 5.5rem; resize: vertical; }
.form .hint { font-size: var(--s1); color: var(--muted); font-weight: 400; }
.compare { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.5rem; font: 400 var(--s2) var(--sans); }
.compare li { display: flex; flex-wrap: wrap; gap: 0.4rem 0.9rem; align-items: baseline; }
.compare .mono { overflow-wrap: anywhere; }

/* ---- next ---- */
.next ul { margin: 0; padding-left: 1.1em; display: grid; gap: 0.6rem; max-width: 65ch; }
.never { border-left: 3px solid var(--ink); padding-left: 1rem; }

footer { border-top: 1px solid var(--rule); padding-block: 1.5rem 2.5rem; font: 400 var(--s1)/1.5 var(--sans); color: var(--muted); }

/* ---- transaction dialog ---- */
dialog { border: 2px solid var(--ink); background: var(--sheet); color: var(--ink); padding: 0; width: min(46rem, 100% - 1.5rem); max-height: min(88vh, 60rem); }
dialog::backdrop { background: rgba(26, 29, 34, 0.55); }
.dlg { display: grid; gap: 1.1rem; padding: 1.4rem; font-family: var(--sans); font-size: var(--s2); }
.dlg header { display: flex; justify-content: space-between; gap: 1rem; align-items: start; }
.dlg h2 { font-size: var(--s5); }
.dlg h3 { font: 600 var(--s2) var(--sans); margin-bottom: 0.35rem; }
.dlg ul { margin: 0; padding-left: 1.1em; display: grid; gap: 0.3rem; }
.dlg .txid { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
.dlg .txid code { overflow-wrap: anywhere; }
.notes { list-style: none; padding: 0 !important; }
.notes li { border-top: 1px solid var(--rule); padding-top: 0.45rem; display: grid; gap: 0.15rem; }
.notes code { overflow-wrap: anywhere; color: var(--muted); }

@media (max-width: 760px) {
  h1 { font-size: 2.1rem; }
  .lede { font-size: var(--s3); }
  .sheets { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 84%; overflow-x: auto; scroll-snap-type: x mandatory; padding: 0.25rem 0.25rem 1.25rem; margin-inline: -0.25rem; }
  .sheet { scroll-snap-align: start; }
  .feed > li { grid-template-columns: minmax(0, 1fr) auto; }
  .feed .blk { grid-column: 1; }
  .feed .type { grid-column: 1; grid-row: 2; }
  .feed .what { grid-column: 1 / -1; }
  .feed > li > .open { grid-column: 2; grid-row: 1 / 3; }
  .top nav { order: 3; width: 100%; gap: 0.9rem; }
  html { scroll-padding-top: 6.5rem; }
}
</style>
</head>

      },

  };
  let lang = store.get('lang') || ((navigator.language || '').toLowerCase().startsWith('fr') ? 'fr' : 'en');
  const t = (k, p = {}) => String(T[lang][k] ?? T.en[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => (p[x] !== undefined ? p[x] : ''));
  const loc = () => (lang === 'fr' ? 'fr-FR' : 'en-US');
  const n = (x) => { try { return BigInt(x).toLocaleString(loc()); } catch { return String(x); } };
  const short = (hex) => (hex && hex.length > 22 ? hex.slice(0, 10) + '…' + hex.slice(-8) : hex || '');
  const bar = (w, i) => html`<span class="bar" role="img" aria-label="${t('hiddenLabel')}" style="--w:${w}em;--i:${i}"></span>`;
  const mark = (s) => html`<span class="mark">${s}</span>`;

  // ---- where the data comes from ----
  const DEMO = (() => { try { return JSON.parse($('#demo-data').textContent || '{}'); } catch { return {}; } })();
  const validUrl = (u) => { try { const x = new URL(u); return x.protocol === 'https:' || x.protocol === 'http:'; } catch { return false; } };
  function client(base) {
    if (!base) {
      return { name: 'demo', get: async (p) => { const v = DEMO.routes && DEMO.routes[p]; if (v === undefined) throw new Error('not in the demo sample'); return JSON.parse(JSON.stringify(v)); } };
    }
    const root = base.replace(/\/+$/, '');
    return {
      name: root,
      get: async (p) => {
        const ctl = new AbortController();
        const timer = setTimeout(() => ctl.abort(), 8000);
        try {
          const r = await fetch(root + p, { signal: ctl.signal, headers: { accept: 'application/json' }, credentials: 'omit', referrerPolicy: 'no-referrer' });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return await r.json();
        } catch (e) {
          throw new Error(e.name === 'AbortError' ? 'timeout' : e.message);
        } finally { clearTimeout(timer); }

  const S = { demo: true, fromLink: false, indexers: [], explorer: '', status: null, tokens: [], listings: [], blocks: [], hero: null, compare: null, error: null };
  const tokenOf = (ticker) => S.tokens.find((x) => x.ticker === ticker);

  async function load() {
    const params = new URLSearchParams(location.search);
    const fromLink = params.getAll('indexer').filter(validUrl);
    S.fromLink = fromLink.length > 0;
    S.indexers = S.fromLink ? fromLink : (store.get('indexers') || []).filter(validUrl);
    S.explorer = validUrl(store.get('explorer') || '') ? store.get('explorer') : '';
    S.demo = S.indexers.length === 0;
    S.client = client(S.demo ? null : S.indexers[0]);
    S.error = null; S.compare = null; S.hero = null;
    try {
      const [status, tokens, listings, blocks] = await Promise.all(['/status', '/tokens', '/listings', '/blocks?limit=200'].map((p) => S.client.get(p)));
      Object.assign(S, { status, tokens, listings, blocks });
      const latest = blocks.flatMap((b) => b.events).find((e) => e.type === 'TRANSFER');
      if (latest) S.hero = await S.client.get('/tx/' + latest.txid);
    } catch (e) {
      S.error = { url: S.client.name, msg: e.message };
      Object.assign(S, { status: null, tokens: [], listings: [], blocks: [] });
    }
    render();
    compare();
  }

  async function compare() {
    if (S.demo || S.error) { S.compare = S.demo ? { demo: true } : null; renderStatus(); renderCompare(); return; }
    S.compare = { pending: true, rows: [] };
    renderStatus(); renderCompare();
    const clients = S.indexers.map(client);
    const statuses = await Promise.all(clients.map((c) => c.get('/status').then((s) => ({ s }), (e) => ({ e: e.message }))));
    const heights = statuses.filter((x) => x.s && Number.isInteger(x.s.height)).map((x) => x.s.height);
    const common = heights.length ? Math.min(...heights) : null;
    const digests = await Promise.all(clients.map((c, i) => (statuses[i].s && common !== null
      ? c.get('/digest/' + common).then((d) => d.digest, (e) => ({ e: e.message }))
      : Promise.resolve({ e: statuses[i].e || 'no status' }))));
    const ref = typeof digests[0] === 'string' ? digests[0] : digests.find((d) => typeof d === 'string');
    const rows = clients.map((c, i) => ({ url: c.name, down: typeof digests[i] === 'string' ? null : digests[i].e, digest: typeof digests[i] === 'string' ? digests[i] : null }));
    for (const r of rows) r.same = r.digest !== null && r.digest === ref;
    S.compare = { rows, height: common };
    renderStatus(); renderCompare();
  }

  // ---- describing events ----
  function priceOfDeploy(tk) {
    if (!tk) return '';
    if (tk.payMode === 0) return t('pFree');
    return t(tk.payMode === 1 ? 'pBurn' : 'pPay', { p: n(tk.price) });
  }
  function priceOfMint(tk) {
    if (!tk || tk.payMode === 0) return t('mFree');
    return t(tk.payMode === 1 ? 'mBurn' : 'mPay', { p: n(tk.price) });
  }
  function describe(e) {
    const tk = e.ticker ? tokenOf(e.ticker) : null;
    const l = e.listTxid ? listingOf(e.listTxid) : null;
    const la = l ? { a: n(l.amount), ticker: l.ticker, p: n(l.price) } : { a: '?', ticker: '?', p: '?' };
    switch (e.type) {
      case 'DEPLOY': {
        let s = t('dDeploy', { ticker: e.ticker, max: tk ? n(tk.max) : '?', lim: tk ? n(tk.lim) : '?', price: priceOfDeploy(tk) });
        if (tk && BigInt(tk.pre) > 0n) s += t('dDeployTeam', { pre: n(tk.pre), unlock: n(tk.unlock) });
        if (e.burn && S.status) s += t('dDeployBurn', { d: n(S.status.deployBurn), g: S.status.genesis });
        return html`${s}`;
      }
      case 'MINT': return html`${t('dMint', { v: n(e.v), ticker: e.ticker, price: priceOfMint(tk) })}`;
      case 'TRANSFER': return html`${t('dTransfer')} ${bar(3, 0)} ${t('dTransferAmount')} ${bar(3, 0)} ${t('dTransferParties')} ${bar(4, 0)}`;
      case 'BURN': return html`${t('dBurn', { v: n(e.v), ticker: e.ticker })}`;
      case 'LIST': return html`${t('dList', { a: n(e.amount), ticker: e.ticker, p: n(e.price) })}`;
      case 'TAKE': return html`${t(e.outcome === 'SOLD' ? 'dSold' : 'dCancelled', la)}`;
      case 'CLOSED': return html`${t('dClosed', la)}`;
      case 'CLAIM': return html`${t('dClaim', la)}`;
      case 'TEAM_UNLOCK': return html`${t('dUnlock', { v: n(e.v), ticker: e.ticker })}`;
      default: return html`${e.type}`;
    }
  }
  const reason = (r) => (T[lang].reasons && T[lang].reasons[r]) || r;

    if (S.fromLink) parts.push(html`<div class="banner link"><div class="wrap"><p>${t('linkBanner', { url: S.indexers.join(', ') })}</p></div></div>`);

  function pillHtml() {
    const c = S.compare;
    if (S.error) return html``;
    if (!c || c.demo) return html`<span class="pill na">${t('pillDemo')}</span>`;
    if (c.pending) return html`<span class="pill na">${t('pillWait')}</span>`;
    const live = c.rows.filter((r) => r.digest);
    if (c.rows.length === 1) return html`<span class="pill na">${t('pillOne')}</span>`;
    const same = live.filter((r) => r.same).length;
    if (live.length && same === live.length && same === c.rows.length) return html`<span class="pill ok">${t('pillAgree', { k: same, n: c.rows.length })}</span>`;
    if (live.length > 1 && same !== live.length) return html`<span class="pill bad">${t('pillDisagree')}</span>`;
    return html`<span class="pill na">${t('pillAgree', { k: same, n: c.rows.length })}</span>`;

    const s = S.status;

  function groupPrice(tk) {
    if (!tk || tk.payMode === 0) return t('gFree');

  function renderFeed() {
    const items = [];

  function renderSupply() {
    if (!S.tokens.length) { put($('#supplyTable'), html`<p class="muted sans">${t('noTokens')}</p>`); return; }
    const h = S.status ? S.status.height : 0;
    const rows = S.tokens.map((tk) => {
      const max = BigInt(tk.max); const pre = BigInt(tk.pre); const lim = BigInt(tk.lim); const mints = BigInt(tk.mints);
      const cap = (max - pre) / lim;
      const minted = mints * lim;
      const teamOut = pre > 0n && h >= tk.unlock ? pre : 0n;
      const offers = S.listings.filter((l) => l.ticker === tk.ticker && (l.state === 'ACTIVE' || l.state === 'CLOSED')).reduce((a, l) => a + BigInt(l.amount), 0n);
      const out = BigInt(tk.burned) + offers;
      const ok = out <= minted + teamOut;
      const pct = max > 0n ? (Number((pre * 10000n) / max) / 10000).toLocaleString(loc(), { style: 'percent', maximumFractionDigits: 2 }) : '';
      const team = pre === 0n ? t('teamNone') : t(h >= tk.unlock ? 'teamUnlocked' : 'teamLocked', { v: n(pre), pct, h: n(tk.unlock) });
      const share = cap > 0n ? Number((mints * 1000n) / cap) / 10 : 0;
      const windowText = tk.end ? t('mintWindowEnd', { s: n(tk.start), e: n(tk.end) }) : t('mintWindow', { s: n(tk.start) });
      return html`<tr>
        <td class="ticker">${tk.ticker}</td>
        <td>${n(tk.max)}<small>${priceOfDeploy(tk)}</small></td>
        <td>${n(minted)}<small>${t('mintsOf', { m: n(mints), c: n(cap) })}</small><div class="meter" aria-hidden="true"><i style="width:${Math.min(100, share)}%"></i></div><small>${windowText}</small></td>
        <td>${team}</td>
        <td>${n(tk.burned)}</td>
        <td>${n(offers)}</td>
        <td><span class="pill ${ok ? 'ok' : 'bad'}">${t(ok ? 'checkOk' : 'checkBad')}</span></td>
      </tr>`;
    });
    put($('#supplyTable'), html`<table><thead><tr><th scope="col">${t('cToken')}</th><th scope="col">${t('cMax')}</th><th scope="col">${t('cMinted')}</th><th scope="col">${t('cTeam')}</th><th scope="col">${t('cBurned')}</th><th scope="col">${t('cOffers')}</th><th scope="col">${t('cCheck')}</th></tr></thead><tbody>${rows}</tbody></table>`);
  }

  function renderCompare() {
    const c = S.compare;

    put($('#compare'), html`${c.rows.map((r) => html`<li>
      <span class="pill ${r.down ? 'bad' : r.same ? 'ok' : 'bad'}">${r.down ? t('cmpDown', { m: r.down }) : t(r.same ? 'cmpAgree' : 'cmpDiffer', { h: n(c.height) })}</span>
      <span class="mono">${r.url}</span>${r.digest ? html`<span class="mono muted">${short(r.digest)}</span>` : ''}</li>`)}`);
  }

  // ---- transaction dialog ----
  const dlg = $('#txd');

  async function openTx(txid) {
    let tx;
    try { tx = await S.client.get('/tx/' + txid); } catch (e) { tx = { txid, error: e.message }; }
    const e = tx.event;
    const type = e ? e.type : tx.rejected ? 'REJECTED' : 'TRANSFER';
    const visible = [];
    let hidden = null;
    if (e) {
      switch (e.type) {
        case 'DEPLOY': visible.push(t('vDeployRules')); if (e.burn) hidden = T[lang].hSpend; break;
        case 'MINT': visible.push(t('vMint')); break;
        case 'TRANSFER': visible.push(t('vTransfer')); hidden = T[lang].hTransfer; break;
        case 'BURN': visible.push(t('vBurn')); hidden = T[lang].hSpend; break;
        case 'LIST': visible.push(t('vList')); hidden = T[lang].hSpend; break;
        case 'TAKE': visible.push(t('vSale')); break;
        case 'CLAIM': visible.push(t('vClaim')); break;
        default: break;
      }
      if (e.type !== 'TRANSFER') visible.unshift(describe(e));
      visible.push(t('vFee'));
    } else if (tx.rejected) {
      visible.push(t('dRejected', { r: reason(tx.rejected) }));
    }
    const nfs = e ? (e.nullifiers || (e.burn && e.burn.nullifiers) || []) : [];
    const notes = tx.notes || [];
    const link = !S.demo && S.explorer ? S.explorer.replace(/\/+$/, '') + '/tx/' + txid : null;
    put($('#txdBody'), html`
      <header><div><h2 id="txdTitle">${t(type)}</h2><p class="muted">${tx.height !== undefined ? t('block', { h: n(tx.height) }) : ''}</p></div>
        <button class="btn quiet" type="button" id="txdClose">${t('close')}</button></header>
      <div class="txid"><code>${txid}</code><button class="open" type="button" id="txdCopy">${t('copy')}</button></div>
      ${tx.error ? html`<p class="muted">${tx.error}</p>` : ''}
      ${visible.length ? html`<div><h3>${t('seeAll')}</h3><ul>${visible.map((v) => html`<li>${v}</li>`)}</ul></div>` : ''}
      ${e ? html`<div><h3>${t('seeNone')}</h3>${hidden ? html`<ul>${hidden.map((v) => html`<li>${v}</li>`)}</ul>` : html`<p>${t('hPublic')}</p>`}</div>` : ''}
      ${nfs.length ? html`<div><h3>${t('nfs')}</h3><ul class="notes">${nfs.map((x) => html`<li><code>${x}</code></li>`)}</ul></div>` : ''}
      ${notes.length ? html`<div><h3>${t('notesMade')}</h3><ul class="notes">${notes.map((x) => html`<li><span>${t('k' + x.kind)}, ${t('position', { p: n(x.pos) })}</span><code>${x.leaf}</code></li>`)}</ul></div>` : ''}
      ${link ? html`<a href="${link}" rel="noopener noreferrer">${t('viewOn')}</a>` : S.demo ? html`<p class="muted">${t('demoTx')}</p>` : ''}`);
    $('#txdClose').addEventListener('click', () => dlg.close());
    $('#txdCopy').addEventListener('click', async (ev) => {
      try { await navigator.clipboard.writeText(txid); ev.target.textContent = t('copied'); } catch { /* copy refused */ }
    });
    if (!dlg.open) dlg.showModal();
  }
  dlg.addEventListener('close', () => {
    if (location.hash.startsWith('#tx-')) { try { history.replaceState(null, '', '#' + returnTo); } catch { /* ignore */ } }
  });
  dlg.addEventListener('click', (ev) => { if (ev.target === dlg) dlg.close(); });
  function fromHash() {
    const m = location.hash.match(/^#tx-([0-9a-f]{64})$/);
    if (m && S.client) openTx(m[1]);
  }

  document.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-tx]');
    if (!b) return;
    returnTo = location.hash.startsWith('#tx-') ? returnTo : location.hash.slice(1);
    location.hash = 'tx-' + b.dataset.tx;
  });
  window.addEventListener('hashchange', fromHash);
  $('#lang').addEventListener('click', () => { lang = lang === 'fr' ? 'en' : 'fr'; store.set('lang', lang); render(); });
  $('#ixForm').addEventListener('submit', (ev) => {
    ev.preventDefault();
    const list = $('#ixList').value.split(/\s+/).map((x) => x.trim()).filter(validUrl);
    const ex = $('#ixExplorer').value.trim();
    store.set('indexers', list);
    store.set('explorer', validUrl(ex) ? ex : '');
    if (S.fromLink) { location.search = ''; return; }
    load();
  });

  load().then(fromHash);
})();
</script>
</body>
</html>
