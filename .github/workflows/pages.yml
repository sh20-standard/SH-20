name: pages

# Publishes the vault and the explorer as one static site on GitHub Pages, from main: no server to rent, and the
# site is built from the commit anyone can read. Off until the repository variable PAGES is set to "on" (Settings >
# Secrets and variables > Actions > Variables), with Pages set to "GitHub Actions" (Settings > Pages).
#
#   /            → redirects to vault/
#   /vault/      → the vault (vault/build.js)
#   /explorer/   → the explorer (explorer/index.html)
#   /phone/      → the phone test page (circuit/web), for testers' measurements
#
# GitHub Pages sends no cross-origin isolation headers: the vault isolates itself with its service worker (sw.js at the
# site's root) and proves on several threads all the same. The origin, <owner>.github.io, is shared only with the other
# Pages sites of the same account: keep that account for SH-20 alone (docs/AUDIT.md 8.1 says why an origin matters).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.PAGES == 'on'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the signet profile: the build stops while vault/src/profile.js has no activation height, so
      # nothing is published before the launch fixes it (docs/SIGNET.md)
      - run: node vault/build.js --signet
      - name: the explorer beside the vault
        run: mkdir -p vault/dist/explorer && cp explorer/index.html vault/dist/explorer/index.html
      # testers measure their phones here (circuit/web/README.md), with the WebAssembly modules the vault
      # ships: the CI checks they are what circuit/ builds (vault/tools/prover.sh --check)
      - name: the phone test page beside them
        run: |
          mkdir -p vault/dist/phone
          (cd circuit/web && cp index.html app.js host.js prover-worker.js thread-worker.js sw.js ../../vault/dist/phone/)
          cp vault/prover/sh20_circuit.wasm vault/prover/sh20_circuit_threads.wasm circuit/artifacts/spend.pk vault/dist/phone/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: vault/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
